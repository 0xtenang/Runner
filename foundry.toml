# Foundry build for the RUNNER contracts. Libraries live in lib/ (not in git):
# run scripts/setup-contracts.sh once to fetch the pinned versions.
[profile.default]
src = "contracts"
test = "contracts/test"
out = "contracts/out"
cache_path = "contracts/cache"
libs = ["lib"]
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
auto_detect_solc = true

[profile.default.fuzz]
runs = 256

[rpc_endpoints]
robinhood = "https://robinhood.drpc.org"

[lint]
lint_on_build = false
