<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Back to RUNNER</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    :root { --bg: #fff; --fg: #111; --muted: #666; --accent: #a3e635; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0b0b0c; --fg: #f2f2f2; --muted: #9a9a9a; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
      font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; }
    main { padding: 24px 16px; max-width: 360px; }
    img { width: 72px; height: 72px; }
    h1 { font-size: 22px; margin: 16px 0 8px; }
    p { color: var(--muted); margin: 0 0 24px; }
    a.btn { display: block; padding: 14px 18px; border-radius: 14px; background: var(--accent); color: #111;
      font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <img src="icon.svg" alt="">
    <h1>Signed in</h1>
    <p>Tap below to go back to the RUNNER app.</p>
    <a class="btn" id="open" href="./">Open RUNNER</a>
  </main>
  <script>
    // Google/Apple sign-in from the RUNNER phone app returns here with a
    // one-time code. Hand it back to the app through its link scheme.
    // (Opened in a normal browser without a code, this just goes home.)
    const q = new URLSearchParams(location.search);
    if (q.has('privy_oauth_code')) {
      const url = 'fun.runearn.app://redirect' + location.search;
      document.getElementById('open').href = url;
      location.href = url;
    } else {
      location.replace('./');
    }
  </script>
</body>
</html>
